name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  core-go-ci:
    name: Core Go Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter Check
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'services/core-go/**'
              - '.github/workflows/ci.yml'

      - name: Setup Go
        if: steps.filter.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/core-go/go.sum

      - name: Install Dependencies
        if: steps.filter.outputs.go == 'true'
        run: go mod download

      - name: Vet & Lint
        if: steps.filter.outputs.go == 'true'
        run: go vet ./...

      - name: Run Tests
        if: steps.filter.outputs.go == 'true'
        run: go test -race -v ./...

      - name: Build Binary
        if: steps.filter.outputs.go == 'true'
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o core_server ./cmd/server/main.go

  ai-fastapi-ci:
    name: AI FastAPI Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-fastapi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter Check
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai:
              - 'services/ai-fastapi/**'
              - '.github/workflows/ci.yml'

      - name: Setup Python
        if: steps.filter.outputs.ai == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-fastapi/requirements.txt

      - name: Install Dependencies
        if: steps.filter.outputs.ai == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint Code
        if: steps.filter.outputs.ai == 'true'
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        if: steps.filter.outputs.ai == 'true'
        run: pytest
